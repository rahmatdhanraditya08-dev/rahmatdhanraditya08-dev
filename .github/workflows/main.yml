name: Generate Snake

on:
  # Berjalan secara otomatis setiap 24 jam
  schedule:
    - cron: "0 */24 * * *"

  # Memungkinkan untuk menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Membuat animasi snake berdasarkan kontribusi user
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push konten dari direktori 'dist' ke branch baru bernama 'output'
      # Ini membuat animasi dapat diakses di README
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/github-action-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
